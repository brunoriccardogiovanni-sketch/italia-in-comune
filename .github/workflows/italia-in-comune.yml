name: Italia in comune

on:
  schedule:
    - cron: '23 11 * * *'   # carosello: ogni giorno alle 12:23 ora italiana (13:23 con l'ora legale)
    - cron: '23 17 * * *'   # reel: ogni giorno alle 18:23 ora italiana (19:23 con l'ora legale)
    - cron: '7,37 * * * *'  # commenti e voti: ogni mezz'ora
  workflow_dispatch:
    inputs:
      azione:
        description: Cosa fare
        type: choice
        options: [verifica, anteprima, calendario, lancio, intro, extra, carosello, reel, commenti]
        default: verifica

permissions:
  contents: write

concurrency:
  group: italia-in-comune
  cancel-in-progress: false

jobs:
  esegui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: dati-v2
      - name: Installa strumenti
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Esegui
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_HOST: ${{ secrets.GRAPH_HOST }}
          TZ: Europe/Rome
        run: |
          git config user.name "italia-in-comune-bot"
          git config user.email "italia-in-comune-bot@users.noreply.github.com"
          mkdir -p media && touch media/.gitkeep
          AZIONE="${{ github.event.inputs.azione }}"
          if [ -z "$AZIONE" ]; then
            case "${{ github.event.schedule }}" in
              "23 11 * * *") AZIONE=carosello ;;
              "23 17 * * *") AZIONE=reel ;;
              *) AZIONE=commenti ;;
            esac
          fi
          case "$AZIONE" in
            carosello|reel) python -m bot.main pubblica "$AZIONE" ;;
            *) python -m bot.main "$AZIONE" ;;
          esac
      - name: Salva l'anteprima
        if: github.event.inputs.azione == 'anteprima'
        uses: actions/upload-artifact@v4
        with:
          name: anteprima
          path: anteprima/
